<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies · Kaleid</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1d1d20; --muted: #6b6b76;
    --border: #e3e3e8; --accent: #4f46e5; --accent-text: #ffffff; --chip: #eef0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114; --panel: #1b1b20; --text: #ececf1; --muted: #9a9aa6;
      --border: #2c2c34; --accent: #818cf8; --accent-text: #111114; --chip: #26263a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tabs button { background: none; border: 0; color: var(--muted); padding: 10px 14px; font: inherit;
                 cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  input, textarea { flex: 1; font: inherit; color: var(--text); background: var(--panel);
                    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  textarea { resize: vertical; min-height: 44px; }
  button.primary { font: inherit; background: var(--accent); color: var(--accent-text); border: 0;
                   border-radius: 8px; padding: 0 18px; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px 16px; margin-top: 12px; }
  .card h3 { margin: 0; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px;
          font-size: 12px; margin: 0 4px 4px 0; }
  .msg { margin-top: 14px; }
  .msg .who { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .msg .body { white-space: pre-wrap; }
  .status { color: var(--muted); margin-top: 12px; min-height: 1.5em; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Movies</h1>
  <p class="sub">Hybrid search (dense + BM25, fused with RRF) over a movies collection stored in Kaleid.</p>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="search">Search</button>
    <button role="tab" aria-selected="false" data-tab="chat">Chat</button>
  </div>

  <section id="search">
    <form class="row" id="search-form">
      <input id="q" placeholder="e.g. robots in space, a heist gone wrong, Japanese animation" autocomplete="off">
      <button class="primary" type="submit">Search</button>
    </form>
    <div class="status" id="search-status"></div>
    <div id="results"></div>
  </section>

  <section id="chat" class="hidden">
    <div id="messages"></div>
    <form class="row" id="chat-form" style="margin-top:16px">
      <textarea id="chat-input" rows="1" placeholder="Ask about the movies..."></textarea>
      <button class="primary" type="submit" id="chat-send">Send</button>
    </form>
    <div class="status" id="chat-status"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.querySelectorAll(".tabs button").forEach((btn) => btn.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b === btn));
  ["search", "chat"].forEach((t) => $(t).classList.toggle("hidden", t !== btn.dataset.tab));
}));

function card(r) {
  const m = r.metadata || {};
  const bits = [m.year, (m.original_language || "").toUpperCase()].filter(Boolean).join(" · ");
  const genres = (m.genres || []).map((g) => `<span class="chip">${esc(g)}</span>`).join("");
  return `<div class="card"><h3>${esc(m.title || r.id)}</h3>
    <div class="meta">${esc(bits)}${r.score !== undefined ? ` · score ${r.score.toFixed(4)}` : ""}</div>
    ${genres ? `<div>${genres}</div>` : ""}<div>${esc(r.overview)}</div></div>`;
}

$("search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("search-status").textContent = "Searching...";
  $("results").innerHTML = "";
  try {
    const t0 = performance.now();
    const resp = await fetch("/api/search?q=" + encodeURIComponent(q));
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    $("search-status").textContent = `${data.results.length} results in ${Math.round(performance.now() - t0)} ms`;
    $("results").innerHTML = data.results.map(card).join("");
  } catch (err) {
    $("search-status").textContent = "Error: " + err.message;
  }
});

const history = [];
function addMessage(role, text, extra = "") {
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `<div class="who">${role}</div><div class="body">${esc(text)}</div>${extra}`;
  $("messages").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

$("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("chat-input").value.trim();
  if (!text) return;
  $("chat-input").value = "";
  history.push({ role: "user", content: text });
  addMessage("you", text);
  $("chat-send").disabled = true;
  $("chat-status").textContent = "Thinking...";
  try {
    const resp = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ messages: history }) });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    history.push({ role: "assistant", content: data.reply });
    const searched = (data.searches || []).map((s) => `<span class="chip">searched: ${esc(s)}</span>`).join("");
    addMessage("assistant", data.reply, searched ? `<div style="margin-top:6px">${searched}</div>` : "");
    $("chat-status").textContent = "";
  } catch (err) {
    $("chat-status").textContent = "Error: " + err.message;
  } finally {
    $("chat-send").disabled = false;
  }
});
$("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chat-form").requestSubmit(); }
});

fetch("/api/status").then((r) => r.json()).then((s) => {
  if (!s.chat) $("chat-status").textContent = "Chat is disabled: start the server with an LLM configured (see README).";
});
</script>
</body>
</html>
